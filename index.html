<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Produtos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .btn-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-filtros {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-relatorio {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            margin: 0 5px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-delete {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .modal-content {
            background-color: white;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .filtro-ativo {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .filtro-ativo strong {
            color: #667eea;
        }

        .btn-limpar-filtro {
            background: #999;
            padding: 6px 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .actions {
            white-space: nowrap;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .success {
            background: #efe;
            color: #060;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 250px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 8px;
            z-index: 1;
            padding: 10px;
        }

        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        @media (max-width: 768px) {
            table {
                font-size: 14px;
            }

            th, td {
                padding: 10px 5px;
            }

            .btn-small {
                padding: 6px 12px;
                font-size: 12px;
            }

            .btn-toolbar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Gestão de Produtos</h1>

        <div class="btn-toolbar">
            <button class="btn" id="btnAdicionar">➕ Novo Produto</button>
            
            <div class="dropdown">
                <button class="btn btn-filtros">🔍 Filtros</button>
                <div class="dropdown-content">
                    <a href="#" id="filtroId">🔢 Por Identificador</a>
                    <a href="#" id="filtroDescricao">📝 Por Descrição (contém)</a>
                    <a href="#" id="filtroSaldoZero">📊 Produtos com Saldo = 0</a>
                </div>
            </div>

            <button class="btn btn-relatorio" id="btnRelatorio">📄 Gerar Relatório</button>
        </div>

        <div id="filtroAtivo" class="filtro-ativo" style="display:none;">
            <strong>Filtro ativo:</strong> <span id="textoFiltro"></span>
            <button class="btn btn-limpar-filtro" id="btnLimparFiltro">✖ Limpar</button>
        </div>

        <div id="mensagem"></div>
        <div id="loading" class="loading" style="display:none;">Carregando...</div>

        <table id="tabelaProdutos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Saldo Atual</th>
                    <th>Preço Unitário</th>
                    <th>Observações</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
            </tbody>
        </table>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" id="btnFechar">&times;</span>
            <h2 id="modalTitulo">Adicionar Produto</h2>
            <form id="formProduto">
                <input type="hidden" id="produtoId">

                <div class="form-group">
                    <label for="id_produto">ID do Produto:</label>
                    <input type="number" id="id_produto" required>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" required>
                </div>

                <div class="form-group">
                    <label for="saldo_atual">Saldo Atual:</label>
                    <input type="number" id="saldo_atual" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="preco_unitario">Preço Unitário (R$):</label>
                    <input type="number" id="preco_unitario" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes"></textarea>
                </div>

                <button type="submit" class="btn">Salvar</button>
            </form>
        </div>
    </div>

    <div id="modalFiltro" class="modal">
        <div class="modal-content">
            <span class="close" id="btnFecharFiltro">&times;</span>
            <h2 id="tituloFiltro">Filtrar Produtos</h2>
            <form id="formFiltro">
                <div class="form-group" id="campoFiltro"></div>
                <button type="submit" class="btn">Aplicar Filtro</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://lutwlisdkciaslvqauyh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1dHdsaXNka2NpYXNsdnFhdXloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4ODgxODYsImV4cCI6MjA4MjQ2NDE4Nn0.CYAhmx4HxXjE6yBIIascPb0Y4siG-oUsGUfWP83am6Q';
        
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let modoEdicao = false;
        let filtroAtual = null;
        let produtosFiltrados = [];

        window.addEventListener('DOMContentLoaded', function() {
            carregarProdutos();
            
            document.getElementById('btnAdicionar').addEventListener('click', abrirModalAdicionar);
            document.getElementById('btnFechar').addEventListener('click', fecharModal);
            document.getElementById('btnFecharFiltro').addEventListener('click', fecharModalFiltro);
            document.getElementById('formProduto').addEventListener('submit', salvarProduto);
            document.getElementById('formFiltro').addEventListener('submit', aplicarFiltro);
            document.getElementById('btnLimparFiltro').addEventListener('click', limparFiltro);
            document.getElementById('btnRelatorio').addEventListener('click', gerarRelatorio);
            
            document.getElementById('filtroId').addEventListener('click', function(e) {
                e.preventDefault();
                abrirModalFiltro('id');
            });
            
            document.getElementById('filtroDescricao').addEventListener('click', function(e) {
                e.preventDefault();
                abrirModalFiltro('descricao');
            });
            
            document.getElementById('filtroSaldoZero').addEventListener('click', function(e) {
                e.preventDefault();
                aplicarFiltroSaldoZero();
            });
            
            window.addEventListener('click', function(event) {
                if (event.target.id === 'modal') {
                    fecharModal();
                }
                if (event.target.id === 'modalFiltro') {
                    fecharModalFiltro();
                }
            });
        });

        async function carregarProdutos() {
            document.getElementById('loading').style.display = 'block';
            
            try {
                const { data, error } = await sb
                    .from('produtos')
                    .select('*')
                    .order('id_produto', { ascending: true });

                if (error) throw error;

                produtosFiltrados = data;
                exibirProdutos(data);
            } catch (error) {
                mostrarMensagem('Erro ao carregar produtos: ' + error.message, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function exibirProdutos(produtos) {
            const tbody = document.getElementById('corpoTabela');
            tbody.innerHTML = '';

            if (produtos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhum produto encontrado</td></tr>';
                return;
            }

            produtos.forEach(produto => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${produto.id_produto}</td>
                    <td>${produto.descricao}</td>
                    <td>${formatarNumero(produto.saldo_atual)}</td>
                    <td>R$ ${formatarNumero(produto.preco_unitario)}</td>
                    <td>${produto.observacoes || '-'}</td>
                    <td class="actions">
                        <button class="btn btn-small btn-edit" onclick="editarProduto(${produto.id_produto})">✏️</button>
                        <button class="btn btn-small btn-delete" onclick="excluirProduto(${produto.id_produto})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function formatarNumero(valor) {
            return parseFloat(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function abrirModalAdicionar() {
            modoEdicao = false;
            document.getElementById('modalTitulo').textContent = 'Adicionar Produto';
            document.getElementById('formProduto').reset();
            document.getElementById('produtoId').value = '';
            document.getElementById('id_produto').disabled = false;
            document.getElementById('modal').style.display = 'block';
        }

        async function editarProduto(id) {
            modoEdicao = true;
            document.getElementById('modalTitulo').textContent = 'Editar Produto';

            try {
                const { data, error } = await sb
                    .from('produtos')
                    .select('*')
                    .eq('id_produto', id)
                    .single();

                if (error) throw error;

                document.getElementById('produtoId').value = id;
                document.getElementById('id_produto').value = data.id_produto;
                document.getElementById('id_produto').disabled = true;
                document.getElementById('descricao').value = data.descricao;
                document.getElementById('saldo_atual').value = data.saldo_atual;
                document.getElementById('preco_unitario').value = data.preco_unitario;
                document.getElementById('observacoes').value = data.observacoes || '';

                document.getElementById('modal').style.display = 'block';
            } catch (error) {
                mostrarMensagem('Erro ao carregar produto: ' + error.message, 'error');
            }
        }

        async function salvarProduto(event) {
            event.preventDefault();

            const produto = {
                id_produto: parseInt(document.getElementById('id_produto').value),
                descricao: document.getElementById('descricao').value,
                saldo_atual: parseFloat(document.getElementById('saldo_atual').value),
                preco_unitario: parseFloat(document.getElementById('preco_unitario').value),
                observacoes: document.getElementById('observacoes').value
            };

            try {
                if (modoEdicao) {
                    const { error } = await sb
                        .from('produtos')
                        .update(produto)
                        .eq('id_produto', produto.id_produto);

                    if (error) throw error;
                    mostrarMensagem('Produto atualizado com sucesso!', 'success');
                } else {
                    const { error } = await sb
                        .from('produtos')
                        .insert([produto]);

                    if (error) throw error;
                    mostrarMensagem('Produto adicionado com sucesso!', 'success');
                }

                fecharModal();
                carregarProdutos();
            } catch (error) {
                mostrarMensagem('Erro ao salvar produto: ' + error.message, 'error');
            }
        }

        async function excluirProduto(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) {
                return;
            }

            try {
                const { error } = await sb
                    .from('produtos')
                    .delete()
                    .eq('id_produto', id);

                if (error) throw error;

                mostrarMensagem('Produto excluído com sucesso!', 'success');
                carregarProdutos();
            } catch (error) {
                mostrarMensagem('Erro ao excluir produto: ' + error.message, 'error');
            }
        }

        function abrirModalFiltro(tipo) {
            filtroAtual = { tipo: tipo };
            const campoFiltro = document.getElementById('campoFiltro');
            
            if (tipo === 'id') {
                document.getElementById('tituloFiltro').textContent = 'Filtrar por ID';
                campoFiltro.innerHTML = `
                    <label for="valorFiltro">ID do Produto:</label>
                    <input type="number" id="valorFiltro" required>
                `;
            } else if (tipo === 'descricao') {
                document.getElementById('tituloFiltro').textContent = 'Filtrar por Descrição';
                campoFiltro.innerHTML = `
                    <label for="valorFiltro">Texto contido na descrição:</label>
                    <input type="text" id="valorFiltro" required>
                `;
            }
            
            document.getElementById('modalFiltro').style.display = 'block';
        }

        async function aplicarFiltro(event) {
            event.preventDefault();
            const valor = document.getElementById('valorFiltro').value;
            
            try {
                const { data, error } = await sb
                    .from('produtos')
                    .select('*')
                    .order('id_produto', { ascending: true });

                if (error) throw error;

                let resultado;
                let textoFiltro;

                if (filtroAtual.tipo === 'id') {
                    resultado = data.filter(p => p.id_produto == valor);
                    textoFiltro = `ID = ${valor}`;
                } else if (filtroAtual.tipo === 'descricao') {
                    resultado = data.filter(p => p.descricao.toLowerCase().includes(valor.toLowerCase()));
                    textoFiltro = `Descrição contém "${valor}"`;
                }

                produtosFiltrados = resultado;
                exibirProdutos(resultado);
                mostrarFiltroAtivo(textoFiltro);
                fecharModalFiltro();
            } catch (error) {
                mostrarMensagem('Erro ao aplicar filtro: ' + error.message, 'error');
            }
        }

        async function aplicarFiltroSaldoZero() {
            try {
                const { data, error } = await sb
                    .from('produtos')
                    .select('*')
                    .eq('saldo_atual', 0)
                    .order('id_produto', { ascending: true });

                if (error) throw error;

                produtosFiltrados = data;
                exibirProdutos(data);
                mostrarFiltroAtivo('Saldo = 0');
            } catch (error) {
                mostrarMensagem('Erro ao aplicar filtro: ' + error.message, 'error');
            }
        }

        function mostrarFiltroAtivo(texto) {
            document.getElementById('textoFiltro').textContent = texto;
            document.getElementById('filtroAtivo').style.display = 'block';
        }

        function limparFiltro() {
            document.getElementById('filtroAtivo').style.display = 'none';
            filtroAtual = null;
            carregarProdutos();
        }

        function gerarRelatorio() {
            if (produtosFiltrados.length === 0) {
                mostrarMensagem('Não há produtos para gerar relatório!', 'error');
                return;
            }

            let html = `
                <html>
                <head>
                    <title>Relatório de Produtos</title>
                    <style>
                        body { font-family: Arial; padding: 20px; }
                        h1 { color: #667eea; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
                        th { background: #667eea; color: white; }
                        .total { font-weight: bold; background: #f0f0f0; }
                    </style>
                </head>
                <body>
                    <h1>📄 Relatório de Produtos</h1>
                    <p><strong>Data:</strong> ${new Date().toLocaleDateString('pt-BR')}</p>
                    <p><strong>Total de produtos:</strong> ${produtosFiltrados.length}</p>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Descrição</th>
                                <th>Saldo Atual</th>
                                <th>Preço Unitário</th>
                                <th>Valor Total</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            let valorTotal = 0;
            produtosFiltrados.forEach(p => {
                const total = p.saldo_atual * p.preco_unitario;
                valorTotal += total;
                html += `
                    <tr>
                        <td>${p.id_produto}</td>
                        <td>${p.descricao}</td>
                        <td>${formatarNumero(p.saldo_atual)}</td>
                        <td>R$ ${formatarNumero(p.preco_unitario)}</td>
                        <td>R$ ${formatarNumero(total)}</td>
                    </tr>
                `;
            });

            html += `
                        <tr class="total">
                            <td colspan="4">VALOR TOTAL EM ESTOQUE</td>
                            <td>R$ ${formatarNumero(valorTotal)}</td>
                        </tr>
                    </tbody>
                </table>
                </body>
                </html>
            `;

            const janela = window.open('', '_blank');
            janela.document.write(html);
            janela.document.close();
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function fecharModalFiltro() {
            document.getElementById('modalFiltro').style.display = 'none';
        }

        function mostrarMensagem(texto, tipo) {
            const div = document.getElementById('mensagem');
            div.className = tipo;
            div.textContent = texto;
            div.style.display = 'block';

            setTimeout(() => {
                div.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
