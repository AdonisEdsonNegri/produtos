<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Produtos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-add {
            margin-bottom: 20px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            margin: 0 5px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-delete {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .actions {
            white-space: nowrap;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .success {
            background: #efe;
            color: #060;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            table {
                font-size: 14px;
            }

            th, td {
                padding: 10px 5px;
            }

            .btn-small {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Gestão de Produtos</h1>

        <button class="btn btn-add" id="btnAdicionar">➕ Adicionar Produto</button>

        <div id="mensagem"></div>
        <div id="loading" class="loading" style="display:none;">Carregando...</div>

        <table id="tabelaProdutos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Saldo Atual</th>
                    <th>Preço Unitário</th>
                    <th>Observações</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
            </tbody>
        </table>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" id="btnFechar">&times;</span>
            <h2 id="modalTitulo">Adicionar Produto</h2>
            <form id="formProduto">
                <input type="hidden" id="produtoId">

                <div class="form-group">
                    <label for="id_produto">ID do Produto:</label>
                    <input type="number" id="id_produto" required>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" required>
                </div>

                <div class="form-group">
                    <label for="saldo_atual">Saldo Atual:</label>
                    <input type="number" id="saldo_atual" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="preco_unitario">Preço Unitário (R$):</label>
                    <input type="number" id="preco_unitario" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes"></textarea>
                </div>

                <button type="submit" class="btn">Salvar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://lutwlisdkciaslvqauyh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1dHdsaXNka2NpYXNsdnFhdXloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4ODgxODYsImV4cCI6MjA4MjQ2NDE4Nn0.CYAhmx4HxXjE6yBIIascPb0Y4siG-oUsGUfWP83am6Q';
        
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let modoEdicao = false;

        window.addEventListener('DOMContentLoaded', function() {
            carregarProdutos();
            
            document.getElementById('btnAdicionar').addEventListener('click', abrirModalAdicionar);
            document.getElementById('btnFechar').addEventListener('click', fecharModal);
            document.getElementById('formProduto').addEventListener('submit', salvarProduto);
            
            window.addEventListener('click', function(event) {
                const modal = document.getElementById('modal');
                if (event.target == modal) {
                    fecharModal();
                }
            });
        });

        async function carregarProdutos() {
            document.getElementById('loading').style.display = 'block';
            
            try {
                const { data, error } = await sb
                    .from('produtos')
                    .select('*')
                    .order('id_produto', { ascending: true });

                if (error) throw error;

                exibirProdutos(data);
            } catch (error) {
                mostrarMensagem('Erro ao carregar produtos: ' + error.message, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function exibirProdutos(produtos) {
            const tbody = document.getElementById('corpoTabela');
            tbody.innerHTML = '';

            if (produtos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhum produto cadastrado</td></tr>';
                return;
            }

            produtos.forEach(produto => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${produto.id_produto}</td>
                    <td>${produto.descricao}</td>
                    <td>${formatarNumero(produto.saldo_atual)}</td>
                    <td>R$ ${formatarNumero(produto.preco_unitario)}</td>
                    <td>${produto.observacoes || '-'}</td>
                    <td class="actions">
                        <button class="btn btn-small btn-edit" data-id="${produto.id_produto}" onclick="editarProduto(${produto.id_produto})">✏️ Editar</button>
                        <button class="btn btn-small btn-delete" data-id="${produto.id_produto}" onclick="excluirProduto(${produto.id_produto})">🗑️ Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function formatarNumero(valor) {
            return parseFloat(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function abrirModalAdicionar() {
            modoEdicao = false;
            document.getElementById('modalTitulo').textContent = 'Adicionar Produto';
            document.getElementById('formProduto').reset();
            document.getElementById('produtoId').value = '';
            document.getElementById('id_produto').disabled = false;
            document.getElementById('modal').style.display = 'block';
        }

        async function editarProduto(id) {
            modoEdicao = true;
            document.getElementById('modalTitulo').textContent = 'Editar Produto';

            try {
                const { data, error } = await sb
                    .from('produtos')
                    .select('*')
                    .eq('id_produto', id)
                    .single();

                if (error) throw error;

                document.getElementById('produtoId').value = id;
                document.getElementById('id_produto').value = data.id_produto;
                document.getElementById('id_produto').disabled = true;
                document.getElementById('descricao').value = data.descricao;
                document.getElementById('saldo_atual').value = data.saldo_atual;
                document.getElementById('preco_unitario').value = data.preco_unitario;
                document.getElementById('observacoes').value = data.observacoes || '';

                document.getElementById('modal').style.display = 'block';
            } catch (error) {
                mostrarMensagem('Erro ao carregar produto: ' + error.message, 'error');
            }
        }

        async function salvarProduto(event) {
            event.preventDefault();

            const produto = {
                id_produto: parseInt(document.getElementById('id_produto').value),
                descricao: document.getElementById('descricao').value,
                saldo_atual: parseFloat(document.getElementById('saldo_atual').value),
                preco_unitario: parseFloat(document.getElementById('preco_unitario').value),
                observacoes: document.getElementById('observacoes').value
            };

            try {
                if (modoEdicao) {
                    const { error } = await sb
                        .from('produtos')
                        .update(produto)
                        .eq('id_produto', produto.id_produto);

                    if (error) throw error;
                    mostrarMensagem('Produto atualizado com sucesso!', 'success');
                } else {
                    const { error } = await sb
                        .from('produtos')
                        .insert([produto]);

                    if (error) throw error;
                    mostrarMensagem('Produto adicionado com sucesso!', 'success');
                }

                fecharModal();
                carregarProdutos();
            } catch (error) {
                mostrarMensagem('Erro ao salvar produto: ' + error.message, 'error');
            }
        }

        async function excluirProduto(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) {
                return;
            }

            try {
                const { error } = await sb
                    .from('produtos')
                    .delete()
                    .eq('id_produto', id);

                if (error) throw error;

                mostrarMensagem('Produto excluído com sucesso!', 'success');
                carregarProdutos();
            } catch (error) {
                mostrarMensagem('Erro ao excluir produto: ' + error.message, 'error');
            }
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function mostrarMensagem(texto, tipo) {
            const div = document.getElementById('mensagem');
            div.className = tipo;
            div.textContent = texto;
            div.style.display = 'block';

            setTimeout(() => {
                div.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
